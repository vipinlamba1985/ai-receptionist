name: Hostline CI

on:
  pull_request:
    paths:
      - "app/**"
      - "lib/**"
      - "tests/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/hostline-ci.yml"
  push:
    branches:
      - "feature/hostline-text-v1"
      - "feature/hostline-text-v1-phase-2"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
