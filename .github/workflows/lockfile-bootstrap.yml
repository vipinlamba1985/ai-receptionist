name: Bootstrap deterministic npm lockfile

on:
  push:
    branches:
      - "feature/hostline-text-v1"
    paths:
      - ".github/workflows/lockfile-bootstrap.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hostline-text-v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Resolve dependencies and create lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Pin direct dependencies to resolved versions
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const section of ['dependencies', 'devDependencies']) {
            for (const name of Object.keys(pkg[section] || {})) {
              const resolved = lock.packages?.[`node_modules/${name}`]?.version;
              if (!resolved) throw new Error(`No resolved version for ${name}`);
              pkg[section][name] = resolved;
            }
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit deterministic dependency metadata
        run: |
          rm .github/workflows/lockfile-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/lockfile-bootstrap.yml
          git commit -m "chore: pin dependencies and add npm lockfile"
          git push origin HEAD:feature/hostline-text-v1
